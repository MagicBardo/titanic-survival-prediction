[project]
name = "titanic-survival-prediction"
version = "0.1.0"
description = "Machine learning model predicting Titanic survival"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "kaggle>=2.2.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.3.260530",
    "pathlib>=1.0.1",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titanic_ml"]
